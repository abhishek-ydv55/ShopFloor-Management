# =============================================
# ManuVya Shopfloor Backend - Application Config
# =============================================

# Server
server.port=8080
spring.application.name=shopfloor-backend

# =============================================
# H2 Database Configuration
# =============================================
spring.datasource.url=jdbc:h2:mem:shopfloordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# =============================================
# JWT Configuration
# =============================================
app.jwt.secret=ShopfloorManuVyaSecretKey2024SuperLongStringForHMAC512Security
app.jwt.expiration-ms=86400000

# =============================================
# CORS
# =============================================
# Only needed during local development (Angular dev server on :4200).
# In production the frontend is served from the same JAR origin, so
# cross-origin requests do not occur.
app.cors.allowed-origins=http://localhost:4200

# =============================================
# Static Resources / SPA
# =============================================
# Disable Spring Boot's default /** resource handler so that
# SpaWebMvcConfig can register its own handler with the Angular
# index.html fallback.  Without this, both handlers compete and
# the fallback never fires.
spring.web.resources.add-mappings=false

# =============================================
# Logging
# =============================================
logging.level.com.manuvya.shopfloor=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG

# =============================================
# Swagger / OpenAPI
# =============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
